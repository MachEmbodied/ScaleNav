name: tests-and-package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - name: Configure build scratch directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[training,dev]'
      - run: python -m pytest --basetemp="$HOME/awm-source-tests"
      - run: python -m build && python -m twine check dist/*
      - run: python scripts/check_release.py
      - name: Check installed wheel away from source tree
        run: |
          python -m pip uninstall -y awm-navigation
          python -m pip install --no-deps dist/*.whl
          mkdir -p "$HOME/awm-wheel-check"
          cd "$HOME/awm-wheel-check"
          awm --help
          awm doctor
          python -c "from importlib.resources import files; assert files('awm').joinpath('configs/inference.yaml').is_file()"
          python -m pytest "$GITHUB_WORKSPACE/tests" --basetemp="$HOME/awm-wheel-tests"
